    statement: "Local history of the last 100 calculations; tap to reuse a result or expression; clear history"
    priority: SHOULD
    status: ACTIVE
    features:
      - F003
    decisions: []
    supersedes: []
    superseded_by: null
    created_at: 2026-10-24
    rationale: "Reduces re-typing; differentiator vs default calculators"
