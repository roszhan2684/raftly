requirements:
  - id: REQ-001
    statement: "Evaluate +, −, ×, ÷ and parentheses with standard operator precedence"
    priority: MUST
    status: ACTIVE
    features:
      - F001
      - F002
    decisions: []
    supersedes: []
    superseded_by: null
    created_at: 2026-10-24
    rationale: "Core job; users expect 2 + 3 × 4 = 14"
  - id: REQ-002
    statement: Results are exact for decimal input (0.1 + 0.2 = 0.3) and displayed with up to 16 significant digits using round-half-even at display time only
    priority: MUST
    status: ACTIVE
    features:
      - F001
    decisions: []
    supersedes: []
    superseded_by: null
    created_at: 2026-10-24
    rationale: "Correctness is the main differentiator; binary floats visibly fail"
  - id: REQ-003
    statement: "Edge cases behave predictably: divide by zero, repeated equals, percent, leading/trailing decimal point, very large/small results"
    priority: MUST
    status: ACTIVE
    features:
      - F001
    decisions: []
    supersedes: []
    superseded_by: null
    created_at: 2026-10-24
    rationale: Predictable semantics prevent user errors
  - id: REQ-004
    statement: Works fully offline on web and mobile after first load or install
    priority: MUST
    status: ACTIVE
    features:
      - F006
    decisions: []
    supersedes: []
    superseded_by: null
    created_at: 2026-10-24
    rationale: "Utility must work anywhere; no server exists"
  - id: REQ-005
    statement: "Accessible to WCAG 2.2 AA: screen readers announce input and results, all functions keyboard-operable on web, 44pt/48dp targets"
    priority: MUST
    status: ACTIVE
    features:
      - F002
      - F005
    decisions: []
    supersedes: []
    superseded_by: null
    created_at: 2026-10-24
    rationale: Accessibility is part of the product (Constitution 28)
