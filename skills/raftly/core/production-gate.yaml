# Production gate catalog. scripts/gate.py instantiates the checks that apply to a
# project's profile (state.yaml project.profile) and marks the rest NOT_APPLICABLE
# with the reason. A simple offline calculator is never penalised for lacking a
# database, queue or Kubernetes.
#
# applies_when grammar: "always" | term [and term]... [or term [and term]...]
#   term := flag | not flag | surface:<name> | sensitive:<class|any> | regulated:<name|any> | ui
#   flags: backend accounts personal_data payments multi_tenant ai public_site email
#          file_uploads integrations analytics
#   ui    := any of surface web/ios/android/mobile/desktop/extension
#
# Severity: blocker (FAIL => NOT_READY), major, minor. Weights in scripts/forgelib/gate.py.
checks:
  - {id: G-PRODUCT-SCOPE, category: product, severity: blocker, applies_when: always,
     title: "All MUST requirements are implemented and verified"}
  - {id: G-PRODUCT-FLOWS, category: product, severity: blocker, applies_when: always,
     title: "Core user flows verified end-to-end"}
  - {id: G-AUTH, category: auth, severity: blocker, applies_when: accounts,
     title: "Authentication implemented with secure session handling"}
  - {id: G-AUTHZ-SERVER, category: authorization, severity: blocker, applies_when: backend and accounts,
     title: "Authorization enforced server-side on every protected operation"}
  - {id: G-TENANT-ISOLATION, category: tenant-isolation, severity: blocker, applies_when: multi_tenant,
     title: "Tenant isolation verified by tests (cross-tenant access denied)"}
  - {id: G-DATA-MIGRATIONS, category: data-migrations, severity: major, applies_when: backend,
     title: "Schema migrations versioned, tested, with rollback or compensation plan"}
  - {id: G-BACKUPS, category: backups, severity: blocker, applies_when: backend,
     title: "Automated backups configured for all persistent stores"}
  - {id: G-RESTORE, category: restore, severity: major, applies_when: backend,
     title: "Restore from backup verified at least once"}
  - {id: G-DATA-EXPORT-DELETE, category: privacy, severity: major, applies_when: personal_data,
     title: "User data export and deletion paths work"}
  - {id: G-SEC-SECRETS, category: security, severity: blocker, applies_when: always,
     title: "No secrets in source control; secrets managed per environment"}
  - {id: G-SEC-DEPS, category: security, severity: major, applies_when: always,
     title: "Dependency audit shows no known critical/high vulnerabilities without mitigation"}
  - {id: G-SEC-INPUT, category: security, severity: blocker, applies_when: backend,
     title: "Input validated at every trust boundary; injection risks addressed"}
  - {id: G-SEC-HEADERS, category: security, severity: major, applies_when: surface:web,
     title: "Security headers and CSP configured for the web surface"}
  - {id: G-SEC-RATE, category: rate-limits, severity: major, applies_when: backend,
     title: "Rate limiting on authentication and expensive endpoints"}
  - {id: G-SEC-UPLOADS, category: security, severity: blocker, applies_when: file_uploads,
     title: "File uploads restricted (type, size, scanning, storage isolation)"}
  - {id: G-SEC-WEBHOOKS, category: security, severity: blocker, applies_when: payments or integrations,
     title: "Inbound webhooks verified (signature) and processed idempotently"}
  - {id: G-SEC-AI, category: security, severity: major, applies_when: ai,
     title: "Prompt-injection, data-leakage and output-handling controls in place"}
  - {id: G-SEC-THREAT-MODEL, category: security, severity: major, applies_when: backend,
     title: "Threat model reviewed against the implemented system"}
  - {id: G-PRIV-INVENTORY, category: privacy, severity: major, applies_when: personal_data,
     title: "Personal-data inventory, purpose and retention documented"}
  - {id: G-PRIV-LOGGING, category: privacy, severity: major, applies_when: personal_data,
     title: "Sensitive/personal data excluded or redacted from logs and analytics"}
  - {id: G-PRIV-SENSITIVE, category: privacy, severity: blocker, applies_when: sensitive:any,
     title: "Sensitive data classes have access control, encryption and audit trail"}
  - {id: G-COMPLIANCE-READINESS, category: compliance, severity: blocker, applies_when: regulated:any or sensitive:phi or sensitive:payment_card,
     title: "Compliance readiness checklist complete and reviewed by a qualified professional"}
  - {id: G-TEST-AUTOMATED, category: testing, severity: blocker, applies_when: always,
     title: "Automated test suite passes in CI"}
  - {id: G-TEST-REGRESSION, category: testing, severity: major, applies_when: always,
     title: "Regression coverage on critical paths"}
  - {id: G-TEST-PLATFORMS, category: testing, severity: major, applies_when: surface:ios or surface:android or surface:mobile or surface:desktop,
     title: "Platform/device matrix verified"}
  - {id: G-A11Y, category: accessibility, severity: major, applies_when: ui,
     title: "Accessibility checks (WCAG 2.2 AA target) on key flows"}
  - {id: G-PERF, category: performance, severity: major, applies_when: surface:web or backend or surface:mobile or surface:ios or surface:android,
     title: "Performance budget defined and met"}
  - {id: G-MONITORING, category: monitoring, severity: major, applies_when: backend,
     title: "Error tracking and service monitoring in production"}
  - {id: G-CLIENT-ERRORS, category: monitoring, severity: minor, applies_when: ui and not backend,
     title: "Client crash/error visibility decided (tooling or explicit privacy-preserving opt-out)"}
  - {id: G-ALERTS, category: alerts, severity: major, applies_when: backend,
     title: "Alerts on SLO/critical failures routed to an owner"}
  - {id: G-LOGS, category: logs, severity: major, applies_when: backend,
     title: "Structured logs with correlation ids; no secrets in logs"}
  - {id: G-HEALTH, category: monitoring, severity: major, applies_when: backend,
     title: "Health checks and readiness probes"}
  - {id: G-ROLLBACK, category: rollback, severity: blocker, applies_when: always,
     title: "Rollback path defined and rehearsed (previous build / deploy revert / store release)"}
  - {id: G-INCIDENT, category: incident-response, severity: major, applies_when: backend,
     title: "Incident response path: owner, contact, runbook"}
  - {id: G-ENV-PARITY, category: environments, severity: minor, applies_when: backend,
     title: "Staging environment with configuration parity"}
  - {id: G-BILLING, category: billing, severity: blocker, applies_when: payments,
     title: "Billing lifecycle verified incl. failed payments, refunds, cancellation"}
  - {id: G-EMAIL-DOMAIN, category: email, severity: major, applies_when: email,
     title: "Sending domain authenticated (SPF, DKIM, DMARC)"}
  - {id: G-SUPPORT, category: support, severity: minor, applies_when: always,
     title: "Support/contact path visible to users"}
  - {id: G-LEGAL-DOCS, category: legal, severity: major, applies_when: personal_data or accounts or payments or surface:ios or surface:android or surface:mobile,
     title: "Privacy policy / terms published (requires professional review)"}
  - {id: G-SEO, category: seo, severity: minor, applies_when: public_site,
     title: "Public site metadata, sitemap, robots and performance"}
  - {id: G-ANALYTICS, category: analytics, severity: minor, applies_when: analytics,
     title: "Analytics events verified; consent where required; internal traffic filtered"}
  - {id: G-STORE, category: distribution, severity: major, applies_when: surface:ios or surface:android or surface:mobile,
     title: "App store listing, privacy labels and review requirements satisfied"}
  - {id: G-AI-EVALS, category: ai, severity: blocker, applies_when: ai,
     title: "AI eval suite meets agreed thresholds on a versioned dataset"}
  - {id: G-AI-FALLBACK, category: ai, severity: major, applies_when: ai,
     title: "Fallback/degradation defined for model errors, timeouts and low confidence"}
  - {id: G-AI-COST, category: ai, severity: major, applies_when: ai,
     title: "Inference cost budget, per-tenant limits and cost alerts"}
