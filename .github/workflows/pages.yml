name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", "examples/**/artifacts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the example blueprints to the site
        run: |
          mkdir -p site/examples
          cp examples/calculator/artifacts/blueprint.html site/examples/calculator.html
          cp examples/b2b-ai-saas/artifacts/blueprint.html site/examples/b2b-ai-saas.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
